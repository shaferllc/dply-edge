# Production dply Valkey gateway. apply.sh substitutes __DOMAIN__ and
# __IMAGE__ and creates every Secret (API token, admin password, R2 keys,
# cert-manager's DigitalOcean token); none are stored here.
apiVersion: v1
kind: Namespace
metadata:
  name: dply-valkey
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: valkey-gateway
  namespace: dply-valkey
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: valkey-gateway
  namespace: dply-valkey
rules:
  - apiGroups: [""]
    resources: ["pods", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: valkey-gateway
  namespace: dply-valkey
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: valkey-gateway
subjects:
  - kind: ServiceAccount
    name: valkey-gateway
    namespace: dply-valkey
---
# Wildcard cert from Let's Encrypt, proven through Cloudflare DNS (the zone
# for __DOMAIN__ is on Cloudflare; the *.cache record must be DNS only).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt
  namespace: dply-valkey
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-dns
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: valkey-gateway-tls
  namespace: dply-valkey
spec:
  secretName: valkey-gateway-tls
  issuerRef:
    name: letsencrypt
  dnsNames:
    - "*.cache.__DOMAIN__"
    - "*.db.__DOMAIN__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-gateway
  namespace: dply-valkey
spec:
  # One gateway: idle-sleep tracking is in memory, and a rolling update would
  # briefly run two (packages/valkey-gateway/README.md).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: valkey-gateway }
  template:
    metadata:
      labels: { app: valkey-gateway }
    spec:
      serviceAccountName: valkey-gateway
      # DOKS registry integration copies this secret into each namespace but
      # only attaches it to the "default" service account.
      imagePullSecrets:
        - name: dply-cloud
      containers:
        - name: gateway
          image: __IMAGE__
          env:
            - { name: DOMAIN, value: "cache.__DOMAIN__" }
            - { name: DB_DOMAIN, value: "db.__DOMAIN__" }
            - { name: API_TLS, value: "1" }
            # The edge R2 bucket: snapshots live under tenants/, sites under edge/.
            - name: S3_BUCKET
              valueFrom: { secretKeyRef: { name: valkey-gateway-r2, key: bucket } }
            - { name: S3_REGION, value: auto }
            - name: S3_ENDPOINT
              valueFrom: { secretKeyRef: { name: valkey-gateway-r2, key: endpoint } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: valkey-gateway-r2, key: access-key } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: valkey-gateway-r2, key: secret-key } }
            - name: API_TOKEN
              valueFrom: { secretKeyRef: { name: valkey-gateway-api, key: token } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: valkey-gateway-admin, key: password } }
            # Warm pods per size (MB). Each one reserves its memory all the time,
            # and a 4 GB node only has ~2.9 GiB allocatable: one 250 MB pod keeps
            # the common size instant; 1 GB and up start fresh (~1-2 s).
            - { name: POOL, value: "250:1" }
            # Databases (ruling r-67chv2jdx2ha025q): one pod per app, data on a
            # DigitalOcean volume so it survives node upgrades and replacement.
            - { name: POSTGRES_IMAGE, value: "registry.digitalocean.com/dply-cloud/postgres:17-202609250406" }
            - { name: DB_STORAGE_CLASS, value: do-block-storage }
          ports:
            - { containerPort: 6380, name: valkey }
            - { containerPort: 5432, name: postgres }
            - { containerPort: 8080, name: api }
          readinessProbe:
            tcpSocket: { port: 6380 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - name: tls
          secret: { secretName: valkey-gateway-tls }
---
# Public: 6380 (Valkey), 5432 (Postgres), both TLS + per-app password, and
# 8080 (control API, TLS + bearer token). 5432 approved by the owner 2026-09-25.
apiVersion: v1
kind: Service
metadata:
  name: valkey-gateway
  namespace: dply-valkey
spec:
  type: LoadBalancer
  selector: { app: valkey-gateway }
  ports:
    - { name: valkey, port: 6380, targetPort: 6380 }
    - { name: postgres, port: 5432, targetPort: 5432 }
    - { name: api, port: 8080, targetPort: 8080 }
