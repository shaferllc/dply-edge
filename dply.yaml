# dply deploys dply (dogfood). This repo is a normal container app in dply:
# `php artisan dply:self:register` created the Site (runtime container,
# repo shaferllc/dply-edge @ main, push-to-deploy), so a push to main builds
# and rolls out from dply's own dashboard like any customer's Laravel app.
# `php artisan dply:self:deploy` is the break-glass path when dply is down,
# and `php artisan dply:self:bootstrap` the first start on a fresh database.
# Runbook: docs/self-hosting-runbook.md. Architecture: docs/self-hosting.md.
#
# What runs where (none of it is declared here any more):
#   web         the container app (DPLY_RUNTIME=container, min 1 instance)
#   queue:work  the site's queue workers, control queues only
#               (App\Support\DplyRuntime::CONTROL_QUEUES)
#   scheduler   in worker-0 (Resources -> Queue workers -> scheduler)
#   migrations  never on boot. dply:self:deploy runs them once, in the new
#               image, before rollout; a dashboard deploy does not migrate
#               (additive ones: Resources -> Database -> Migrate afterwards)
#   builds      the builder pool on DOKS (deploy/builders/), DPLY_RUNTIME=builder,
#               which drains only dply-provision / dply-builder
#
# The old `supervisor:` and `processes:` blocks (Horizon, schedule:work,
# warm-images, runtime-check under supervisord on VMs) were removed with the
# VM control plane. The builder pods run Horizon themselves
# (deploy/builders/k8s/builder.yaml) and `dply:runtime:check` is their probe.

headers:
  # Vite's hashed assets never change under the same name.
  - for: /build/*
    values:
      Cache-Control: "public, max-age=31536000, immutable"
